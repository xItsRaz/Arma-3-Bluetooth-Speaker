name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1

      - name: Check
        run: hemtt check

      - name: Release build
        run: hemtt release

      - name: Show output
        if: always()
        run: ls -R .hemttout/release releases 2>/dev/null || true

      # Download this artifact, unzip it into a folder named @JBLSpeaker, load it as a local mod
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: JBLSpeaker
          path: .hemttout/release/
          if-no-files-found: error

  # The sound extension (Rust). Put jbl_speaker_x64.dll next to the addons folder of @JBLSpeaker.
  # Copying your songs to @JBLSpeaker/music is what the DLL plays them from (see README).
  extension:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: JBLSpeaker-extension
          path: extension/target/release/jbl_speaker_x64.dll
          if-no-files-found: error
